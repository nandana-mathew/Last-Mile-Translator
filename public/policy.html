<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Details - Last-Mile Translator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f5f7fa; 
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px;
        }
        .back-btn {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .policy-detail {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { font-size: 2em; margin-bottom: 20px; }
        h2 { color: #667eea; margin: 20px 0 10px; }
        .meta { 
            display: flex; 
            gap: 10px; 
            margin: 15px 0; 
            flex-wrap: wrap; 
        }
        .tag { 
            padding: 6px 14px; 
            border-radius: 16px; 
            font-size: 12px; 
            font-weight: 600;
        }
        .tag-state { background: #e3f2fd; color: #1976d2; }
        .tag-category { background: #f3e5f5; color: #7b1fa2; }
        .tag-date { background: #e8f5e9; color: #388e3c; }
        .summary { 
            background: #f8f9ff; 
            padding: 20px; 
            border-radius: 8px; 
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">← Back to Home</a>
        </header>

        <div id="policyContent" class="policy-detail">
            <div class="loading">Loading policy details...</div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = window.API_URL || window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const policyId = urlParams.get('id');
        const lang = urlParams.get('lang') || localStorage.getItem('preferredLanguage') || 'en';

        const translations = {
            en: { 
                backBtn: '← Back to Home',
                loading: 'Loading policy details...',
                summaryTitle: '📋 Summary', 
                changesTitle: '🔄 Key Changes', 
                impactTitle: '👤 Personal Impact',
                errorMsg: 'Error loading policy: '
            },
            hi: { 
                backBtn: '← होम पर वापस जाएं',
                loading: 'नीति विवरण लोड हो रहा है...',
                summaryTitle: '📋 सारांश', 
                changesTitle: '🔄 मुख्य परिवर्तन', 
                impactTitle: '👤 व्यक्तिगत प्रभाव',
                errorMsg: 'नीति लोड करने में त्रुटि: '
            },
            kn: { 
                backBtn: '← ಮುಖಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ',
                loading: 'ನೀತಿ ವಿವರಗಳನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...',
                summaryTitle: '📋 ಸಾರಾಂಶ', 
                changesTitle: '🔄 ಪ್ರಮುಖ ಬದಲಾವಣೆಗಳು', 
                impactTitle: '👤 ವೈಯಕ್ತಿಕ ಪ್ರಭಾವ',
                errorMsg: 'ನೀತಿಯನ್ನು ಲೋಡ್ ಮಾಡುವಲ್ಲಿ ದೋಷ: '
            },
            mr: { 
                backBtn: '← मुख्यपृष्ठावर परत या',
                loading: 'धोरण तपशील लोड होत आहेत...',
                summaryTitle: '📋 सारांश', 
                changesTitle: '🔄 मुख्य बदल', 
                impactTitle: '👤 वैयक्तिक प्रभाव',
                errorMsg: 'धोरण लोड करताना त्रुटी: '
            },
            ta: { 
                backBtn: '← முகப்புக்குத் திரும்பு',
                loading: 'கொள்கை விவரங்கள் ஏற்றப்படுகின்றன...',
                summaryTitle: '📋 சுருக்கம்', 
                changesTitle: '🔄 முக்கிய மாற்றங்கள்', 
                impactTitle: '👤 தனிப்பட்ட தாக்கம்',
                errorMsg: 'கொள்கையை ஏற்றுவதில் பிழை: '
            }
        };

        async function translateText(text, targetLang) {
            if (targetLang === 'en' || !text) return text;
            try {
                const response = await fetch(`${API_URL}/api/translate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, language: targetLang })
                });
                const data = await response.json();
                return data.success ? data.translation : text;
            } catch (err) {
                console.error('Translation error:', err);
                return text;
            }
        }

        async function loadPolicy() {
            if (!policyId) {
                document.getElementById('policyContent').innerHTML = '<p>Policy not found</p>';
                return;
            }

            // Update UI text based on language
            const backBtn = document.querySelector('.back-btn');
            if (backBtn && translations[lang]) {
                backBtn.textContent = translations[lang].backBtn;
            }

            try {
                // Load policy from API
                const response = await fetch(`${API_URL}/api/policies/recent`);
                const data = await response.json();
                
                if (data.success) {
                    const policy = data.policies.find(p => p.id === policyId);
                    if (policy) {
                        await displayPolicy(policy);
                    } else {
                        document.getElementById('policyContent').innerHTML = '<p>Policy not found</p>';
                    }
                }
            } catch (error) {
                console.error('Error loading policy:', error);
                const errorMsg = translations[lang]?.errorMsg || translations.en.errorMsg;
                document.getElementById('policyContent').innerHTML = `<p>${errorMsg}${error.message}</p>`;
            }
        }

        async function displayPolicy(policy) {
            const content = document.getElementById('policyContent');
            content.innerHTML = `<div class="loading">${translations[lang]?.loading || translations.en.loading}</div>`;

            try {
                // Translate policy content
                const title = await translateText(policy.title, lang);
                const brief = await translateText(policy.brief, lang);
                const state = await translateText(policy.state, lang);
                const category = await translateText(policy.category, lang);
                
                // Generate impact text
                const impactText = `This policy affects ${category.toLowerCase()} sector in ${state}. If you are involved in ${category.toLowerCase()}, you should review the details and take necessary action.`;
                const translatedImpact = await translateText(impactText, lang);

                content.innerHTML = `
                    <h1>${title}</h1>
                    <div class="meta">
                        <span class="tag tag-state">${state}</span>
                        <span class="tag tag-category">${category}</span>
                        <span class="tag tag-date">${new Date(policy.date).toLocaleDateString()}</span>
                    </div>
                    
                    <div class="summary">
                        <h2>${translations[lang]?.summaryTitle || translations.en.summaryTitle}</h2>
                        <p>${brief}</p>
                    </div>

                    <div class="summary">
                        <h2>${translations[lang]?.impactTitle || translations.en.impactTitle}</h2>
                        <p>${translatedImpact}</p>
                    </div>

                    <div class="summary">
                        <h2>📅 ${await translateText('Important Information', lang)}</h2>
                        <p><strong>${await translateText('Published', lang)}:</strong> ${new Date(policy.date).toLocaleDateString()}</p>
                        <p><strong>${await translateText('State', lang)}:</strong> ${state}</p>
                        <p><strong>${await translateText('Category', lang)}:</strong> ${category}</p>
                        <p><strong>${await translateText('Impact Level', lang)}:</strong> ${await translateText(policy.impact || 'Medium', lang)}</p>
                    </div>
                `;
            } catch (error) {
                console.error('Error displaying policy:', error);
                content.innerHTML = `<p>Error displaying policy details</p>`;
            }
        }

        loadPolicy();
    </script>
</body>
</html>
