<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Details - Last-Mile Translator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f5f7fa; 
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px;
        }
        .back-btn {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .policy-detail {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { font-size: 2em; margin-bottom: 20px; }
        h2 { color: #667eea; margin: 20px 0 10px; }
        .meta { 
            display: flex; 
            gap: 10px; 
            margin: 15px 0; 
            flex-wrap: wrap; 
        }
        .tag { 
            padding: 6px 14px; 
            border-radius: 16px; 
            font-size: 12px; 
            font-weight: 600;
        }
        .tag-state { background: #e3f2fd; color: #1976d2; }
        .tag-category { background: #f3e5f5; color: #7b1fa2; }
        .tag-date { background: #e8f5e9; color: #388e3c; }
        .summary { 
            background: #f8f9ff; 
            padding: 20px; 
            border-radius: 8px; 
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">← Back to Home</a>
        </header>

        <div id="policyContent" class="policy-detail">
            <div class="loading">Loading policy details...</div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = window.API_URL || window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const policyId = urlParams.get('id');
        const lang = urlParams.get('lang') || 'en';

        async function loadPolicy() {
            if (!policyId) {
                document.getElementById('policyContent').innerHTML = '<p>Policy not found</p>';
                return;
            }

            try {
                // For demo, show policy details from demo data
                const response = await fetch(`${API_URL}/api/policies/recent`);
                const data = await response.json();
                
                if (data.success) {
                    const policy = data.policies.find(p => p.id === policyId);
                    if (policy) {
                        displayPolicy(policy);
                    } else {
                        document.getElementById('policyContent').innerHTML = '<p>Policy not found</p>';
                    }
                }
            } catch (error) {
                console.error('Error loading policy:', error);
                document.getElementById('policyContent').innerHTML = '<p>Error loading policy details</p>';
            }
        }

        function displayPolicy(policy) {
            document.getElementById('policyContent').innerHTML = `
                <h1>${policy.title}</h1>
                <div class="meta">
                    <span class="tag tag-state">${policy.state}</span>
                    <span class="tag tag-category">${policy.category}</span>
                    <span class="tag tag-date">${new Date(policy.date).toLocaleDateString()}</span>
                </div>
                
                <div class="summary">
                    <h2>📋 Summary</h2>
                    <p>${policy.brief}</p>
                </div>

                <div class="summary">
                    <h2>🎯 What This Means For You</h2>
                    <p>This policy affects ${policy.category.toLowerCase()} sector in ${policy.state}. 
                    If you are involved in ${policy.category.toLowerCase()}, you should review the details and take necessary action.</p>
                </div>

                <div class="summary">
                    <h2>📅 Important Information</h2>
                    <p><strong>Published:</strong> ${new Date(policy.date).toLocaleDateString()}</p>
                    <p><strong>State:</strong> ${policy.state}</p>
                    <p><strong>Category:</strong> ${policy.category}</p>
                    <p><strong>Impact Level:</strong> ${policy.impact || 'Medium'}</p>
                </div>
            `;
        }

        loadPolicy();
    </script>
</body>
</html>
